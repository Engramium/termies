<!doctype html>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Warp Theme Picker</title>
<style>
/* Page chrome uses these tokens. Each mockup carries its own palette as inline variables. */
:root {
  --page-bg: #F4F2ED;
  --page-fg: #23262D;
  --page-muted: #6B707B;
  --page-line: #DCD8CF;
  --page-card: #FFFFFF;
  --page-accent: #3D6B8C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #101114;
    --page-fg: #E4E6EA;
    --page-muted: #9097A3;
    --page-line: #2A2D35;
    --page-card: #16181C;
    --page-accent: #8FA8C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #101114;
  --page-fg: #E4E6EA;
  --page-muted: #9097A3;
  --page-line: #2A2D35;
  --page-card: #16181C;
  --page-accent: #8FA8C8;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--page-bg);
  color: var(--page-fg);
  font: 15px/1.55 "Newsreader", Georgia, "Times New Roman", serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
}
.wrap { max-width: 1160px; margin: 0 auto; }
header { margin-bottom: 24px; }
h1 { font-size: 32px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--page-muted); max-width: 62ch; }

.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
.filters { display: flex; gap: 6px; }
.filters button {
  font: 13px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
  background: transparent; color: var(--page-muted);
  border: 1px solid var(--page-line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--page-fg); border-color: var(--page-accent); }
.filters button:focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px; }
.picked { font: 13px/1.4 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: var(--page-muted); }
.picked b { color: var(--page-fg); font-weight: 500; }

.grid {
  display: grid; gap: 28px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}
.card { min-width: 0; display: flex; flex-direction: column; }
.card.hidden { display: none; }
.label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.label h2 { font-size: 18px; font-weight: 500; margin: 0; }
.label span { font: 12px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: var(--page-muted); white-space: nowrap; }
.note { font-size: 14px; color: var(--page-muted); margin: 6px 0 12px; text-wrap: pretty; min-height: 2.8em; }
.swatches { display: flex; gap: 6px; margin-bottom: 12px; }
.swatches i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--page-line); display: block; }
.pick {
  margin-top: 12px; align-self: flex-start;
  font: 13px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
  background: var(--page-card); color: var(--page-fg);
  border: 1px solid var(--page-line); border-radius: 8px; padding: 9px 14px; cursor: pointer;
}
.pick:hover { border-color: var(--page-accent); }
.pick:focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px; }
.pick[aria-pressed="true"] { border-color: var(--page-accent); color: var(--page-accent); }

/* Terminal mockup. Palette variables come inline from the theme data. */
.term {
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column;
  height: 420px;
  font: 13px/1.6 "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
.bar { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.log { flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg-user { align-self: flex-end; max-width: 82%; background: var(--user-bg); padding: 8px 12px; border-radius: 12px; }
.msg-ai { max-width: 100%; }
.msg-ai code, .accent { color: var(--accent); }
.role { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
pre { margin: 8px 0 0; padding: 10px 12px; background: var(--code-bg); border-radius: 8px; white-space: pre-wrap; overflow-x: auto; font-size: 12px; }
.tool { font-size: 12px; color: var(--muted); }
.tool b { color: var(--ok); font-weight: 500; }
.input { margin: 8px 14px 14px; padding: 9px 12px; border: 1px solid var(--line); background: var(--input-bg); display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; border-radius: var(--input-radius); }
.input kbd { font: inherit; color: var(--accent); }

/* Chat styles: bubbles, thread labels, or a bare prompt line */
.style-bubbles .msg-user { border-radius: 12px; }
.style-thread .msg-user { background: transparent; border: 1px solid var(--line); border-radius: 8px; font-family: "Newsreader", Georgia, serif; font-size: 15px; }
.style-prompt .msg-user { background: transparent; padding: 0; border-radius: 0; align-self: stretch; max-width: 100%; color: var(--accent); }
.style-prompt .msg-user::before { content: "› "; }
.style-prompt .msg-ai { border-left: 1px solid var(--line); padding-left: 12px; }
</style>

<div class="wrap">
  <header>
    <h1>Warp theme picker</h1>
    <p>Each card is a theme shown as a Claude or ChatGPT style exchange in Warp. Filter by dark or light, pick the ones you like, and tell me which one to build.</p>
  </header>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter by mode">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="dark" aria-pressed="false">Dark</button>
      <button type="button" data-filter="light" aria-pressed="false">Light</button>
    </div>
    <div class="picked" aria-live="polite">Picked: <b id="picked-list">none yet</b></div>
  </div>

  <main class="grid" id="grid"></main>
</div>

<script>
const THEMES = [
  { id: "soft-chat", name: "Soft Chat", mode: "dark", style: "bubbles",
    note: "Closest to Claude and ChatGPT. Messages in soft bubbles; replies flow on the left.",
    bg: "#17181C", fg: "#D9DCE2", muted: "#7D8390", line: "#2A2D35", accent: "#8FA8C8",
    userBg: "#262B36", codeBg: "#1E2128", ok: "#9CBF88", inputBg: "#1F2229", inputRadius: "999px",
    swatches: ["#17181C", "#262B36", "#D9DCE2", "#8FA8C8", "#9CBF88"] },
  { id: "paper-thread", name: "Paper Thread", mode: "light", style: "thread",
    note: "Calm and document-like. Each turn is a block with a small role label. Good for long answers.",
    bg: "#F7F5F0", fg: "#2B2E36", muted: "#8A8E98", line: "#E0DCD2", accent: "#3D6B8C",
    userBg: "#ECE8DE", codeBg: "#EEEAE0", ok: "#5C7F4A", inputBg: "#FFFFFF", inputRadius: "999px",
    swatches: ["#F7F5F0", "#ECE8DE", "#2B2E36", "#3D6B8C", "#5C7F4A"] },
  { id: "quiet-ink", name: "Quiet Ink", mode: "dark", style: "prompt",
    note: "Terminal first. Your prompt is one accent line; the reply hangs off a thin rule. Least decoration.",
    bg: "#0E0F11", fg: "#CFD2D6", muted: "#5F6570", line: "#1E2024", accent: "#E0A458",
    userBg: "transparent", codeBg: "#16181C", ok: "#8DB36E", inputBg: "transparent", inputRadius: "4px",
    swatches: ["#0E0F11", "#16181C", "#CFD2D6", "#E0A458", "#8DB36E"] },
  { id: "ember-chat", name: "Ember Chat", mode: "dark", style: "bubbles",
    note: "Warm dark with an ember accent. Friendlier than the cool dark options, still low glare.",
    bg: "#1A1714", fg: "#E2D9CC", muted: "#8A7F72", line: "#2E2924", accent: "#E08A5B",
    userBg: "#2B2622", codeBg: "#221E1A", ok: "#9CBF88", inputBg: "#221E1A", inputRadius: "999px",
    swatches: ["#1A1714", "#2B2622", "#E2D9CC", "#E08A5B", "#9CBF88"] },
  { id: "calm-focus", name: "Calm Focus", mode: "dark", style: "prompt",
    note: "Quiet slate with a steel-blue accent. The safe all-day default from the palette set.",
    bg: "#1B1D22", fg: "#C9CED8", muted: "#6F7684", line: "#2A2D35", accent: "#8FA8C8",
    userBg: "transparent", codeBg: "#22252C", ok: "#9CBF88", inputBg: "transparent", inputRadius: "999px",
    swatches: ["#1B1D22", "#22252C", "#C9CED8", "#8FA8C8", "#9CBF88"] },
  { id: "ink-mono", name: "Ink Mono", mode: "dark", style: "prompt",
    note: "Almost grayscale. The single amber accent is the only color that draws the eye.",
    bg: "#111214", fg: "#CFD2D6", muted: "#5F6570", line: "#25272C", accent: "#E0A458",
    userBg: "transparent", codeBg: "#18191D", ok: "#8DB36E", inputBg: "transparent", inputRadius: "4px",
    swatches: ["#111214", "#18191D", "#CFD2D6", "#E0A458", "#8DB36E"] },
  { id: "forest-dim", name: "Forest Dim", mode: "dark", style: "bubbles",
    note: "Dark green with sage accents. Soft and organic for long evening sessions.",
    bg: "#182019", fg: "#C4CCC2", muted: "#7A8A7C", line: "#2A3429", accent: "#A3C4A8",
    userBg: "#222D23", codeBg: "#1D271E", ok: "#9DBF8A", inputBg: "#1D271E", inputRadius: "999px",
    swatches: ["#182019", "#222D23", "#C4CCC2", "#A3C4A8", "#9DBF8A"] },
  { id: "paper-light", name: "Paper Light", mode: "light", style: "thread",
    note: "Warm off-white with a slate-blue accent. For bright rooms and reading logs.",
    bg: "#F6F4EF", fg: "#2F3440", muted: "#7A808C", line: "#DFDBD2", accent: "#3D6B8C",
    userBg: "#EDE9E0", codeBg: "#ECE8DF", ok: "#5C7F4A", inputBg: "#FFFFFF", inputRadius: "999px",
    swatches: ["#F6F4EF", "#EDE9E0", "#2F3440", "#3D6B8C", "#5C7F4A"] }
];

const SAMPLE_USER = "Why does order 956 still show a payout?";
const SAMPLE_CODE = "if ($order->status === 'cancelled') return;";

const grid = document.getElementById("grid");
const pickedList = document.getElementById("picked-list");
const picked = new Set();

function card(t) {
  const el = document.createElement("section");
  el.className = "card";
  el.dataset.mode = t.mode;
  el.innerHTML = `
    <div class="label"><h2>${t.name}</h2><span>${t.mode}</span></div>
    <div class="swatches">${t.swatches.map(c => `<i style="background:${c}"></i>`).join("")}</div>
    <p class="note">${t.note}</p>
    <div class="term style-${t.style}" style="--bg:${t.bg};--fg:${t.fg};--muted:${t.muted};--line:${t.line};--accent:${t.accent};--user-bg:${t.userBg};--code-bg:${t.codeBg};--ok:${t.ok};--input-bg:${t.inputBg};--input-radius:${t.inputRadius}">
      <div class="bar"><span>Warp · ~/Termies</span><span>● ready</span></div>
      <div class="log">
        <div class="msg-user">${t.style === "thread" ? '<div class="role">You</div>' : ""}${SAMPLE_USER}</div>
        <div class="msg-ai">
          ${t.style === "prompt" ? "" : '<div class="role">Claude</div>'}
          The payout step has no status check. A cancelled order reaches it.
          <pre>${SAMPLE_CODE}</pre>
        </div>
        <div class="tool"><b>✓</b> ran 2 commands · 1 file changed</div>
      </div>
      <div class="input"><span>Ask anything…</span><kbd>⏎ send</kbd></div>
    </div>
    <button type="button" class="pick" aria-pressed="false">Pick this one</button>`;
  const btn = el.querySelector(".pick");
  btn.addEventListener("click", () => {
    const on = !picked.has(t.id);
    on ? picked.add(t.id) : picked.delete(t.id);
    btn.setAttribute("aria-pressed", String(on));
    btn.textContent = on ? "Picked" : "Pick this one";
    pickedList.textContent = picked.size ? [...picked].map(id => THEMES.find(x => x.id === id).name).join(", ") : "none yet";
  });
  return el;
}

THEMES.forEach(t => grid.appendChild(card(t)));

document.querySelectorAll(".filters button").forEach(b => {
  b.addEventListener("click", () => {
    const f = b.dataset.filter;
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    document.querySelectorAll(".card").forEach(c => {
      c.classList.toggle("hidden", f !== "all" && c.dataset.mode !== f);
    });
  });
});
</script>
